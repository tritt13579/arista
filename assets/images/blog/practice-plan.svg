<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 840" font-family="Arial, sans-serif"><rect width="1400" height="840" fill="#eee6d6"/><text x="90" y="95" font-size="23" letter-spacing="5" fill="#8d641f">GÓC HỌC NHẠC · ARISTA</text><text x="86" y="255" font-size="104" fill="#0c0f33">Một buổi tập có mục tiêu.</text><text x="92" y="325" font-size="33" fill="#67697a">20 phút gợi ý · Điều chỉnh theo bài học và người học</text><rect x="90" y="410" width="288" height="310" rx="18" fill="#0c0f33"/><text x="114" y="515" font-size="77" fill="#e2bd77">02</text><text x="115" y="551" font-size="22" fill="#c7c8d2">PHÚT</text><text x="114" y="620" font-size="25" font-weight="bold" fill="#fff">CHUẨN BỊ</text><text x="114" y="667" font-size="21" fill="#c7c8d2">Chọn một mục tiêu</text><rect x="400" y="410" width="288" height="310" rx="18" fill="#0c0f33"/><text x="424" y="515" font-size="77" fill="#e2bd77">10</text><text x="425" y="551" font-size="22" fill="#c7c8d2">PHÚT</text><text x="424" y="620" font-size="25" font-weight="bold" fill="#fff">TẬP TRUNG</text><text x="424" y="667" font-size="21" fill="#c7c8d2">Sửa một đoạn khó</text><rect x="710" y="410" width="288" height="310" rx="18" fill="#0c0f33"/><text x="734" y="515" font-size="77" fill="#e2bd77">05</text><text x="735" y="551" font-size="22" fill="#c7c8d2">PHÚT</text><text x="734" y="620" font-size="25" font-weight="bold" fill="#fff">NỐI CÂU</text><text x="734" y="667" font-size="21" fill="#c7c8d2">Chơi qua chỗ vừa sửa</text><rect x="1020" y="410" width="288" height="310" rx="18" fill="#0c0f33"/><text x="1044" y="515" font-size="77" fill="#e2bd77">03</text><text x="1045" y="551" font-size="22" fill="#c7c8d2">PHÚT</text><text x="1044" y="620" font-size="25" font-weight="bold" fill="#fff">GHI CHÚ</text><text x="1044" y="667" font-size="21" fill="#c7c8d2">Kết quả · Câu hỏi</text><text x="92" y="790" font-size="24" fill="#67697a">Bắt đầu nhỏ. Tập đúng việc. Ghi lại điều cần hỏi.</text></svg>